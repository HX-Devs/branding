<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helix — Animación CSS</title><link rel="stylesheet" href="helix-motion.css"><style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f2eb;color:#292c29}main{width:min(100%,1000px)}p{text-align:center;font:clamp(22px,4vw,34px) Georgia,serif;margin:-20px 20px 80px}
</style></head><body><main><div class="helix-motion" role="img" aria-label="Helix — Crea con propósito">
  <div class="helix-motion__letters" aria-hidden="true">
    <div class="helix-motion__h">
      <span class="helix-motion__stroke helix-motion__left"></span>
      <span class="helix-motion__stroke helix-motion__bridge"></span>
      <span class="helix-motion__stroke helix-motion__diagonal"></span>
    </div>
    <div class="helix-motion__middle">
      <svg viewBox="0 0 448 100" preserveAspectRatio="none" focusable="false">
        <path d="M110 0H182V26H138V37H178V63H138V74H182V100H110Z"/>
        <path d="M202 0H230V74H274V100H202Z"/>
        <path d="M294 0H322V100H294Z"/>
      </svg>
    </div>
    <div class="helix-motion__x">
      <span class="helix-motion__stroke helix-motion__cross"></span>
      <span class="helix-motion__stroke helix-motion__upper"></span>
      <span class="helix-motion__stroke helix-motion__lower"></span>
    </div>
  </div>
</div><p>Crea con propósito.</p></main></body></html>
