<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">HELIX — Del nombre al símbolo</title><desc id="desc">Las letras ELI se atenúan; H y X permanecen. Después sus trazos se acercan y se entrelazan para formar el símbolo aprobado.</desc><rect width="1000" height="400" fill="#F5F2EB" /><g transform="translate(318.5 150)" fill="#292C29"><g transform="translate(0 0)"><path d="M0 0L17 0L17 100L0 100Z" /><path d="M17 41L53 41L53 59L17 59Z" /><path d="M53 0L70 0L70 100L53 100Z" /></g><g opacity="1"><path d="M91 0H152V17H108V41H147V59H108V83H152V100H91Z" /><path d="M173 0H190V83H231V100H173Z" /><path d="M250 0H267V100H250Z" /></g><g transform="translate(281 0)"><g opacity="1"><path d="M0 0L20 0L86 100L66 100Z" /></g><path d="M66 0L86 0L53 50L33 50Z" /><path d="M53 50L20 100L0 100L33 50Z" /></g></g></svg>